<!DOCTYPE html>
<html>

<head>
    <title>Employees</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
        }

        h1 {
            text-align: center;
            color: #302b63;
            margin-top: 40px;
        }

        table {
            width: 70%;
            margin: 40px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #302b63;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #a8edea;
        }

        /* Dark theme */

        body.dark {
            background-color: #222;
            color: white;
        }

        body.dark h1 {
            color: white;
        }

        body.dark table {
            background-color: #333;
        }

        body.dark td {
            color: white;
            border-color: #555;
        }

        body.dark.edit-btn {
            color: #c084d6;
        }

        body.dark tr:hover {
            background-color: #444;
        }
    
    </style>
</head>

<body>
    <h1>Employee Details</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee[0] }}</td>
            <td>{{ employee[1] }}</td>
            <td>{{ employee[2] }}</td>
            <td>{{ employee[3] }}</td>
            <td>{{ employee[4] }}</td>
            <td>
                <a href="/edit/{{ employee[0] }}" class="edit-btn">
                    Edit
                </a>


                <a href="/delete/{{ employee[0] }}" 
                class="delete-btn"
                    onclick="return confirm('Are you want to delete this employee?')">
                    Delete
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

    <script>
        if(localStorage.getItem("theme")=="dark") {
            document.body.classList.add("dark");
        }
    </script>

</body>

</html>
