<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
        }

        h1 {
            text-align: center;
            color: #302b63;
            margin-top: 40px;
        }

        table {
            width: 70%;
            margin: 40px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #302b63;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #a8edea;
        }
    </style>
</head>

<body>
    <h1>Employee Details</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Phone</th>
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee[0] }}</td>
            <td>{{ employee[1] }}</td>
            <td>{{ employee[2] }}</td>
            <td>{{ employee[3] }}</td>
            <td>{{ employee[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
