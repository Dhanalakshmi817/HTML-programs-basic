<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* Navbar */

        .navbar {
            background-color: #172033;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.25);
        }

        /* Logo */

        .logo {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
        }

        /* Navigation links */

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 12px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            padding: 9px 12px;
            border-radius: 7px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background-color: #334155;
            color: #ffffff;
        }

        /* Logout Button */

        .logout-btn {
            border: 1px solid #dc2626;
            padding: 8px 15px !important;
            border-radius: 7px;
            color: #fecaca !important;
        }

        .logout-btn:hover {
            background-color: #dc2626;
            color: white !important;
        }

        /* Content */

        .content {
            padding: 70px 30px;
            text-align: center;
        }

        .content h1 {
            color: #172033;
            margin-bottom: 15px;
        }

        .content p {
            color: #475569;
            font-size: 18px;
        }

        /* Username */

        .username {
            color: #1d4ed8;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Success Message */

        .success {
            color: #334155;
            font-size: 20px;
        }

        /* Theme Buttons */

        .theme-toggle {
            display: flex;
            gap: 5px;
        }

        .theme-toggle a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            padding: 7px 9px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .theme-toggle a:hover {
            background-color: #334155;
            color: white;
        }

        /* Dark Theme */

        body.dark {
            background-color: #f1f5f9;
            color: #334155;
        }

        body.dark .navbar {
            background-color: #172033;
        }

        body.dark .content h1 {
            color: #172033;
        }

        body.dark .content p {
            color: #475569;
        }

        body.dark .success {
            color: #334155;
        }

        body.dark .username {
            color: #1d4ed8;
        }

        body.dark .nav-links a {
            color: #cbd5e1;
        }

        body.dark .nav-links a:hover {
            background-color: #334155;
            color: white;
        }

        body.dark .theme-toggle a {
            color: #cbd5e1;
        }

        body.dark .theme-toggle a:hover {
            background-color: #475569;
            color: white;
        }
    </style>

</head>


<body class="{{ theme }}">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">


        <div class="logo">

            Employee Management System

        </div>


        <ul class="nav-links">


            <!-- Home -->

            <li>

                <a href="/home">
                    Home
                </a>

            </li>

            <li>
                <a href="/dashboard">
                    Dashboard
                </a>
            </li>

            <!-- Employees -->

            <li>

                <a href="/employees">
                    Employees
                </a>

            </li>


            <!-- Add Employee -->

            <li>

                <a href="/addemployee">
                    Add Employee
                </a>

            </li>


            <!-- Search -->

            <li>

                <a href="/search">
                    Search
                </a>

            </li>


            <!-- Logout -->

            <li>

                <a href="/logout" class="logout-btn">
                    Logout
                </a>

            </li>


            <!-- Theme -->

            <li>

                <div class="theme-toggle">

                    <a href="#" onclick="lightTheme()">
                        ☀ Light
                    </a>


                    <a href="#" onclick="darkTheme()">
                        🌙 Dark
                    </a>

                </div>

            </li>


        </ul>

    </nav>


    <!-------------------- HOME CONTENT ---------------------------->


    <div class="content">


        <div class="username">

            Welcome, {{ username }}!

        </div>


        <p class="success">

            You are successfully logged in.

        </p>


    </div>


    <script>


        function lightTheme() {

            document.body.classList.remove("dark");


            // Save theme in cookie

            document.cookie = "theme=light; path=/";


            // Save theme in database

            fetch("/save-theme", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    theme: "light"

                })

            });

        }



        function darkTheme() {

            document.body.classList.add("dark");


            // Save theme in cookie

            document.cookie = "theme=dark; path=/";


            // Save theme in database

            fetch("/save-theme", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    theme: "dark"

                })

            });

        }



        // Get saved theme from database

        let savedTheme = "{{ theme }}";


        if (savedTheme == "dark") {

            document.body.classList.add("dark");

        }



        // Get theme from cookie

        let cookies = document.cookie.split(";");


        for (let cookie of cookies) {

            let parts = cookie.trim().split("=");


            if (
                parts[0] == "theme"
                &&
                parts[1] == "dark"
            ) {

                document.body.classList.add("dark");

            }

        }

    </script>


</body>

</html>
