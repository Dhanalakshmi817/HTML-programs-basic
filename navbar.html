<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
        }

        /* Navbar */
        .navbar {
            background-color: #12063c;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .logo {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #a8edea;
        }

        /* Logout button */

        .logout-btn {
            border: 1px solid #a8edea;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .logout-btn:hover {
            background-color: #a8edea;
            color: #302b63 !important;
        }

         /* Content */

        .content {
            padding: 50px;
            text-align: center;
        }

        .content h1 {
            color: #302b63;
            margin-bottom: 15px;
        }

        .content p {
            color: #732d91;
            font-size: 18px;
        }
        
        .username {
            color: #8e44ad;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .success {
            color: #302b63;
            font-size: 20px;
        }
        /* theme-buttons */

        .theme-toggle {
           display:flex;
           gap:10px;
        }

         .theme-toggle {
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* dark theme */

        body.dark {
            background-color: #222;
            color: white;
        }

        body.dark .content h1 {
            color: white;
        }

        body.light .content p{
            color: white;
        }

        body.dark .success {
            color: white;
        }

        body.dark .username {
                color: #c084d6;
        }

    </style>

</head>

<body class="{{theme}}">

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">

        <div class="logo">
            Employee Management System
        </div>

        <ul class="nav-links">

            <!-- Home -->
            <li>
                <a href="/home">Home</a>
            </li>

            <!-- Employees -->
            <li>
                <a href="/employees">Employees</a>
            </li>

            <!-- Add Employee -->
            <li>
                <a href="/addemployee">Add Employee</a>
            </li>

            <!-- Search -->
            <li>
                <a href="/search">Search</a>
            </li>

            <!-- Login -->
            <li>
                <a href="/logout" class="logout-btn">Logout</a>
            </li>
             
            <!--theme-->

            <li>
                <div class="theme-toggle">
                    <a href="#" onclick="lightTheme()">☀Light</a>
                    <a href="#" onclick="darkTheme()">🌙Dark</a>
                </div>
            </li>

        </ul>

    </nav>
    <!--------------------HOME CONENT---------------------------->
    <div class="content">

        <div class="username">
            Welcome, {{ username }}!
        </div>

        <p class="success">
            You are successfully logged in.
        </p>

    </div>

    <script>

        function lightTheme() {

            document.body.classList.remove("dark");

            // Save theme in cookie
            document.cookie = "theme=light; path=/";

            // Save theme in database
            fetch("/save-theme", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    theme: "light"
                })
            });
        }


        function darkTheme() {

            document.body.classList.add("dark");

            // Save theme in cookie
            document.cookie = "theme=dark; path=/";

            // Save theme in database
            fetch("/save-theme", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    theme: "dark"
                })
            });
        }


        // Get saved theme from database
        let savedTheme = "{{ theme }}";

        if (savedTheme == "dark") {
            document.body.classList.add("dark");
        }


        // Get theme from cookie
        let cookies = document.cookie.split(";");

        for (let cookie of cookies) {

            let parts = cookie.trim().split("=");

            if (parts[0] == "theme" && parts[1] == "dark") {
                document.body.classList.add("dark");
            }
        }

    </script>

</body>

</html>
